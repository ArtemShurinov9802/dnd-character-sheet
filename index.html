ю и линии видимости.`},{id:`darkvision`,nameRu:`Тёмное зрение`,nameEn:`Darkvision`,level:2,school:`transmutation`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: сушёная морковь`,duration:`8 часов`,tacticalRole:`Исследование`,resolution:Kn,summaryRu:`Даёт согласному существу тёмное зрение на 150 футов на 8 часов без концентрации.`,usageRu:`Бросок не нужен; отметьте время окончания и новую дальность тёмного зрения цели.`},{id:`detect-thoughts`,nameRu:`Обнаружение мыслей`,nameEn:`Detect Thoughts`,level:2,school:`divination`,castingTime:`Действие`,range:`На себя`,components:`V, S, M: 1 медная монета`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Разведка и допрос`,resolution:L(`wis`),summaryRu:`Позволяет ощущать мысли существ в пределах 30 футов и читать поверхностные мысли видимой цели. Попытка углубиться требует спасброска Мудрости и раскрывает вторжение.`,usageRu:`Для поверхностных мыслей бросок не нужен; при углублении цель делает спасбросок Мудрости.`},{id:`enhance-ability`,nameRu:`Улучшение характеристики`,nameEn:`Enhance Ability`,level:2,school:`transmutation`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: мех или перо`,duration:`Концентрация, до 1 часа`,tacticalRole:`Поддержка проверок`,resolution:Kn,summaryRu:`Даёт цели преимущество на проверки выбранной характеристики; вариант Телосложения также даёт 2к6 временных хитов. Ячейки выше второй позволяют выбрать дополнительную цель.`,usageRu:`Бросок при сотворении не нужен; цель бросает проверки выбранной характеристики с преимуществом.`},{id:`enlarge-reduce`,nameRu:`Увеличение/Уменьшение`,nameEn:`Enlarge/Reduce`,level:2,school:`transmutation`,castingTime:`Действие`,range:`30 футов`,components:`V, S, M: щепотка железного порошка`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Усиление или ослабление`,resolution:L(`con`),summaryRu:`Увеличивает или уменьшает существо либо предмет на одну категорию размера. Существо меняет наносимый оружием урон на 1к4 и получает преимущество или помеху на проверки и спасброски Силы.`,usageRu:`Несогласное существо делает спасбросок Телосложения; затем применяйте 1к4 к урону оружием цели.`},{id:`flaming-sphere`,nameRu:`Пылающий шар`,nameEn:`Flaming Sphere`,level:2,school:`conjuration`,castingTime:`Действие`,range:`60 футов`,components:`V, S, M: шарик воска`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Урон и давление по области`,resolution:L(`dex`,`half`),dice:Yn(2,6),scaling:Xn(1),damageType:`fire`,summaryRu:`Создаёт огненный шар диаметром 5 футов. Бонусным действием его можно перемещать и таранить; существа рядом получают 2к6 урона огнём, спасбросок Ловкости уменьшает урон вдвое. Выше: +1к6.`,usageRu:`Затронутые существа делают спасбросок Ловкости; при успехе получают половину урона.`},{id:`gentle-repose`,nameRu:`Нетленные останки`,nameEn:`Gentle Repose`,level:2,school:`necromancy`,castingTime:`Действие или ритуал`,range:`Касание`,components:`V, S, M: 2 медные монеты, расходуются`,duration:`10 дней`,tacticalRole:`Сохранение тела`,resolution:qn,summaryRu:`Защищает останки от разложения и превращения в нежить на 10 дней; это время не считается против срока, в течение которого возможно возвращение к жизни.`,usageRu:`Бросок не нужен; отметьте расход двух медных монет и дату окончания эффекта.`},{id:`gust-of-wind`,nameRu:`Порыв ветра`,nameEn:`Gust of Wind`,level:2,school:`evocation`,castingTime:`Действие`,range:`На себя, линия 60 футов`,components:`V, S, M: семя бобового растения`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Перемещение и контроль зоны`,resolution:L(`str`),summaryRu:`Линия сильного ветра отталкивает существ, проваливших спасбросок Силы, затрудняет движение к вам, рассеивает газы и гасит незащищённое пламя. Направление можно менять бонусным действием.`,usageRu:`Существа в линии делают спасбросок Силы; при провале их отталкивает на 15 футов.`},{id:`hold-person`,nameRu:`Удержание личности`,nameEn:`Hold Person`,level:2,school:`enchantment`,castingTime:`Действие`,range:`60 футов`,components:`V, S, M: прямой кусок железа`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Паралич гуманоида`,resolution:L(`wis`),summaryRu:`Гуманоид при провале спасброска Мудрости получает состояние Парализованный. В конце каждого хода повторяет спасбросок. Ячейки выше второй добавляют цели.`,usageRu:`Цель делает спасбросок Мудрости при сотворении и в конце каждого своего хода.`},{id:`invisibility`,nameRu:`Невидимость`,nameEn:`Invisibility`,level:2,school:`illusion`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: ресница в гуммиарабике`,duration:`Концентрация, до 1 часа`,tacticalRole:`Скрытность и отход`,resolution:Kn,summaryRu:`Существо и носимое им снаряжение становятся невидимыми. Эффект заканчивается после атаки, нанесения урона или сотворения заклинания. Ячейки выше второй добавляют цели.`,usageRu:`Бросок не нужен; отслеживайте концентрацию и действия, досрочно завершающие невидимость.`},{id:`knock`,nameRu:`Стук`,nameEn:`Knock`,level:2,school:`transmutation`,castingTime:`Действие`,range:`60 футов`,components:`V`,duration:`Мгновенно`,tacticalRole:`Вскрытие преград`,resolution:qn,summaryRu:`Открывает один вид запора на видимом предмете; Волшебный замок подавляется на 10 минут. Сотворение производит громкий стук, слышимый на 300 футов.`,usageRu:`Бросок не нужен; выберите один замок или засов и сообщите о шуме в радиусе 300 футов.`},{id:`levitate`,nameRu:`Левитация`,nameEn:`Levitate`,level:2,school:`transmutation`,castingTime:`Действие`,range:`60 футов`,components:`V, S, M: металлическая пружина`,duration:`Концентрация, до 10 минут`,tacticalRole:`Вертикальное перемещение и контроль`,resolution:L(`con`),summaryRu:`Поднимает существо или свободный предмет весом до 500 фунтов на 20 футов. Заклинатель может менять высоту; цель перемещается горизонтально только от опоры.`,usageRu:`Несогласное существо делает спасбросок Телосложения; при успехе заклинание на него не действует.`},{id:`locate-object`,nameRu:`Поиск предмета`,nameEn:`Locate Object`,level:2,school:`divination`,castingTime:`Действие`,range:`На себя`,components:`V, S, M: раздвоенная веточка`,duration:`Концентрация, до 10 минут`,tacticalRole:`Поиск`,resolution:qn,summaryRu:`Показывает направление к знакомому предмету в пределах 1 000 футов и направление его движения. Свинец блокирует обнаружение; проточная вода может сбить поиск конкретного предмета.`,usageRu:`Бросок не нужен; ведущий сообщает направление, пока предмет в радиусе и не скрыт свинцом.`},{id:`magic-mouth`,nameRu:`Волшебные уста`,nameEn:`Magic Mouth`,level:2,school:`illusion`,castingTime:`1 минута или ритуал`,range:`30 футов`,components:`V, S, M: нефритовая пыль стоимостью от 10 зм, расходуется`,duration:`Пока не рассеяно`,tacticalRole:`Сигнал и сообщение`,resolution:qn,summaryRu:`Записывает в предмет сообщение до 25 слов и задаёт наблюдаемое условие его воспроизведения. При срабатывании иллюзорные уста произносят сообщение один раз или повторяют его.`,usageRu:`Бросок не нужен; точно запишите сообщение, условие срабатывания и режим повторения.`},{id:`magic-weapon`,nameRu:`Магическое оружие`,nameEn:`Magic Weapon`,level:2,school:`transmutation`,castingTime:`Бонусное действие`,range:`Касание`,components:`V, S`,duration:`1 час`,tacticalRole:`Усиление оружия`,resolution:Kn,summaryRu:`Немагическое оружие становится магическим и получает +1 к броскам атаки и урона. Ячейка 3–5 уровня повышает бонус до +2, а 6+ — до +3.`,usageRu:`Бросок при сотворении не нужен; добавляйте указанный бонус к атакам и урону выбранным оружием.`},{id:`mirror-image`,nameRu:`Зеркальное отражение`,nameEn:`Mirror Image`,level:2,school:`illusion`,castingTime:`Действие`,range:`На себя`,components:`V, S`,duration:`1 минута`,tacticalRole:`Личная защита`,resolution:Kn,summaryRu:`Создаёт три иллюзорные копии. При атаке по вам бросок к6 может перенаправить попадание на копию; её КД равен 10 + ваш модификатор Ловкости, попадание уничтожает копию.`,usageRu:`При каждой атаке по вам бросайте к6 для перенаправления, затем сравнивайте атаку с КД копии.`},{id:`misty-step`,nameRu:`Туманный шаг`,nameEn:`Misty Step`,level:2,school:`conjuration`,castingTime:`Бонусное действие`,range:`На себя`,components:`V`,duration:`Мгновенно`,tacticalRole:`Мобильность`,resolution:Kn,summaryRu:`Телепортирует вас на 30 футов в незанятое пространство, которое вы видите.`,usageRu:`Бросок не нужен; выберите видимую незанятую клетку в пределах 30 футов.`},{id:`ray-of-enfeeblement`,nameRu:`Луч ослабления`,nameEn:`Ray of Enfeeblement`,level:2,school:`necromancy`,castingTime:`Действие`,range:`60 футов`,components:`V, S`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Ослабление урона`,resolution:Jn,summaryRu:`При попадании луч ослабляет существо: его атаки, использующие Силу, наносят половину урона. В конце каждого хода цель делает спасбросок Телосложения, завершая эффект при успехе.`,usageRu:`Сначала совершите дальнюю атаку заклинанием; затем цель делает спасбросок Телосложения в конце хода.`},{id:`rope-trick`,nameRu:`Фокус с верёвкой`,nameEn:`Rope Trick`,level:2,school:`transmutation`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: отрезок верёвки`,duration:`1 час`,tacticalRole:`Укрытие`,resolution:qn,summaryRu:`Верёвка длиной до 60 футов ведёт во внемерное пространство на восемь существ. Снаружи вход невидим, атаки и заклинания через него не проходят.`,usageRu:`Бросок не нужен; отметьте высоту входа, число вошедших и час окончания.`},{id:`scorching-ray`,nameRu:`Палящий луч`,nameEn:`Scorching Ray`,level:2,school:`evocation`,castingTime:`Действие`,range:`120 футов`,components:`V, S`,duration:`Мгновенно`,tacticalRole:`Серийный дальний урон`,resolution:Jn,dice:Yn(2,6),scaling:Xn(2),damageType:`fire`,summaryRu:`Создаёт три огненных луча; для каждого совершается отдельная дальняя атака заклинанием, попадание наносит 2к6 огнём. Каждая ячейка выше второй создаёт ещё один луч.`,usageRu:`Совершите отдельную дальнюю атаку заклинанием за каждый луч; при попадании бросьте 2к6.`},{id:`see-invisibility`,nameRu:`Видение невидимого`,nameEn:`See Invisibility`,level:2,school:`divination`,castingTime:`Действие`,range:`На себя`,components:`V, S, M: щепотка талька`,duration:`1 час`,tacticalRole:`Обнаружение`,resolution:Kn,summaryRu:`Позволяет видеть невидимых существ и предметы как видимые, а также смотреть в Эфирный план на 60 футов.`,usageRu:`Бросок не нужен; в течение часа учитывайте невидимые цели и Эфирный план в пределах 60 футов.`},{id:`shatter`,nameRu:`Дребезги`,nameEn:`Shatter`,level:2,school:`evocation`,castingTime:`Действие`,range:`60 футов`,components:`V, S, M: кусочек слюды`,duration:`Мгновенно`,tacticalRole:`Урон по области`,resolution:L(`con`,`half`),dice:Yn(3,8),scaling:Xn(1),damageType:`thunder`,summaryRu:`Громовой взрыв в сфере радиусом 10 футов наносит 3к8 урона громом; спасбросок Телосложения уменьшает урон вдвое. Неорганические существа имеют помеху. Выше: +1к8.`,usageRu:`Все цели в сфере делают спасбросок Телосложения; при успехе получают половину урона.`},{id:`spider-climb`,nameRu:`Паучье лазание`,nameEn:`Spider Climb`,level:2,school:`transmutation`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: капля битума и паук`,duration:`Концентрация, до 1 часа`,tacticalRole:`Мобильность`,resolution:Kn,summaryRu:`Даёт согласной цели скорость лазания, равную обычной Скорости, и позволяет двигаться по стенам и потолкам без свободных рук.`,usageRu:`Бросок не нужен; отслеживайте концентрацию и новую скорость лазания цели.`},{id:`suggestion`,nameRu:`Внушение`,nameEn:`Suggestion`,level:2,school:`enchantment`,castingTime:`Действие`,range:`30 футов`,components:`V, M: капля мёда`,duration:`Концентрация, до 8 часов`,tacticalRole:`Социальный контроль`,resolution:L(`wis`),summaryRu:`Внушает слышащему и понимающему существу выполнимый курс действий. При провале спасброска Мудрости цель следует внушению до завершения, получения урона от вашей группы или конца эффекта.`,usageRu:`Цель делает спасбросок Мудрости; формулировка должна звучать достижимо и не вести явно к вреду.`},{id:`web`,nameRu:`Паутина`,nameEn:`Web`,level:2,school:`conjuration`,castingTime:`Действие`,range:`60 футов`,components:`V, S, M: кусочек паутины`,duration:`Концентрация, до 1 часа`,tacticalRole:`Контроль области`,resolution:L(`dex`),summaryRu:`Заполняет куб 20 футов паутиной и создаёт труднопроходимую, легко заслонённую область. Вошедшие или начавшие там ход существа рискуют стать Опутанными; освобождение требует проверки Силы.`,usageRu:`Существа делают спасбросок Ловкости; опутанная цель действием проверяет Силу против Сл заклинания.`},{id:`animate-dead`,nameRu:`Оживление мёртвых`,nameEn:`Animate Dead`,level:3,school:`necromancy`,castingTime:`1 минута`,range:`10 футов`,components:`V, S, M: капля крови, кусок плоти и щепотка костной пыли`,duration:`Мгновенно`,tacticalRole:`Создание союзника`,resolution:qn,summaryRu:`Превращает кости или труп гуманоида в скелета или зомби под вашим контролем на 24 часа. Повторное сотворение удерживает контроль; ячейки выше третьей создают или удерживают ещё двух.`,usageRu:`Бросок не нужен; ведите число созданных существ, команды бонусным действием и срок контроля.`},{id:`bestow-curse`,nameRu:`Наложение проклятия`,nameEn:`Bestow Curse`,level:3,school:`necromancy`,castingTime:`Действие`,range:`Касание`,components:`V, S`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Сильное ослабление`,resolution:L(`wis`),summaryRu:`При провале спасброска Мудрости накладывает выбранное проклятие. Высокие ячейки продлевают его: 4 уровень — до 10 минут; 5+ снимает концентрацию и даёт 8 часов, 24 часа или действие до рассеивания.`,usageRu:`Цель делает спасбросок Мудрости; заранее выберите один вариант проклятия.`},{id:`blink`,nameRu:`Мерцание`,nameEn:`Blink`,level:3,school:`transmutation`,castingTime:`Действие`,range:`На себя`,components:`V, S`,duration:`1 минута`,tacticalRole:`Личная защита и мобильность`,resolution:Kn,summaryRu:`В конце каждого вашего хода бросок 11+ на к20 переносит вас в Эфирный план до начала следующего хода; при возвращении можно появиться в пределах 10 футов.`,usageRu:`В конце каждого хода бросайте к20: при 11+ вы исчезаете до начала следующего хода.`},{id:`clairvoyance`,nameRu:`Ясновидение`,nameEn:`Clairvoyance`,level:3,school:`divination`,castingTime:`10 минут`,range:`1 миля`,components:`V, S, M: фокус стоимостью от 100 зм — украшенный рог или стеклянный глаз`,duration:`Концентрация, до 10 минут`,tacticalRole:`Удалённая разведка`,resolution:qn,summaryRu:`Создаёт невидимый сенсор в знакомом месте или очевидной незнакомой точке в пределах мили. Через него можно видеть либо слышать; действием переключается выбранное чувство.`,usageRu:`Бросок не нужен; укажите точку сенсора и отслеживайте концентрацию и выбранное чувство.`},{id:`counterspell`,nameRu:`Контрзаклинание`,nameEn:`Counterspell`,level:3,school:`abjuration`,castingTime:`Реакция, когда видите сотворение заклинания в 60 футах`,range:`60 футов`,components:`S`,duration:`Мгновенно`,tacticalRole:`Прерывание магии`,resolution:L(`con`),summaryRu:`Пытается сорвать видимое заклинание с компонентами. Сотворяющее существо делает спасбросок Телосложения; при провале заклинание рассеивается без эффекта, но его ячейка не тратится.`,usageRu:`Сотворяющее существо делает спасбросок Телосложения против вашей Сл заклинаний.`},{id:`dispel-magic`,nameRu:`Рассеивание магии`,nameEn:`Dispel Magic`,level:3,school:`abjuration`,castingTime:`Действие`,range:`120 футов`,components:`V, S`,duration:`Мгновенно`,tacticalRole:`Снятие магии`,resolution:qn,summaryRu:`Завершает на выбранной цели все действующие заклинания 3 уровня и ниже. Для каждого более высокого заклинания нужна проверка заклинательной характеристики Сл 10 + уровень; высокая ячейка повышает автоматический порог.`,usageRu:`Для каждого эффекта выше уровня использованной ячейки сделайте проверку заклинательной характеристики.`},{id:`fear`,nameRu:`Страх`,nameEn:`Fear`,level:3,school:`illusion`,castingTime:`Действие`,range:`На себя, конус 30 футов`,components:`V, S, M: белое перо`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Групповой контроль`,resolution:L(`wis`),summaryRu:`Существа в конусе, провалившие спасбросок Мудрости, роняют предметы, становятся Испуганными и обязаны удаляться. Вне вашей видимости повторяют спасбросок в конце хода.`,usageRu:`Цели делают спасбросок Мудрости; повторный бросок доступен в конце хода вне вашей видимости.`},{id:`fireball`,nameRu:`Огненный шар`,nameEn:`Fireball`,level:3,school:`evocation`,castingTime:`Действие`,range:`150 футов`,components:`V, S, M: шарик гуано летучей мыши и сера`,duration:`Мгновенно`,tacticalRole:`Мощный урон по области`,resolution:L(`dex`,`half`),dice:Yn(8,6),scaling:Xn(1),damageType:`fire`,summaryRu:`Взрыв в сфере радиусом 20 футов наносит 8к6 огнём и поджигает свободные горючие предметы. Спасбросок Ловкости уменьшает урон вдвое; каждая ячейка выше третьей добавляет 1к6.`,usageRu:`Все цели в сфере делают спасбросок Ловкости; при успехе получают половину урона.`},{id:`fly`,nameRu:`Полёт`,nameEn:`Fly`,level:3,school:`transmutation`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: перо`,duration:`Концентрация, до 10 минут`,tacticalRole:`Мобильность`,resolution:Kn,summaryRu:`Даёт согласной цели скорость полёта 60 футов. Ячейки выше третьей позволяют выбрать дополнительную цель за каждый уровень.`,usageRu:`Бросок не нужен; отслеживайте концентрацию, высоту и скорость полёта каждой цели.`},{id:`gaseous-form`,nameRu:`Газообразная форма`,nameEn:`Gaseous Form`,level:3,school:`transmutation`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: кусочек марли`,duration:`Концентрация, до 1 часа`,tacticalRole:`Проникновение и спасение`,resolution:L(`con`),summaryRu:`Превращает согласную цель в облако со скоростью полёта 10 футов, сопротивлением обычному урону и способностью проходить через узкие щели. Несогласная цель делает спасбросок Телосложения.`,usageRu:`Несогласная цель делает спасбросок Телосложения; форма ограничивает действия и речь.`},{id:`glyph-of-warding`,nameRu:`Охранная руна`,nameEn:`Glyph of Warding`,level:3,school:`abjuration`,castingTime:`1 час`,range:`Касание`,components:`V, S, M: алмазная пыль стоимостью от 200 зм, расходуется`,duration:`Пока не рассеяно или не сработает`,tacticalRole:`Ловушка и защита`,resolution:L(`dex`,`half`),dice:Yn(5,8),scaling:Xn(1),damageType:`chosen`,summaryRu:`Наносит руну на поверхность или предмет и задаёт условие. Взрывная руна причиняет 5к8 выбранного стихийного урона в сфере 20 футов; можно сохранить другое заклинание. Выше: +1к8 взрыва.`,usageRu:`Для взрывной руны цели делают спасбросок Ловкости; при успехе получают половину урона.`},{id:`haste`,nameRu:`Ускорение`,nameEn:`Haste`,level:3,school:`transmutation`,castingTime:`Действие`,range:`30 футов`,components:`V, S, M: стружка корня солодки`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Боевое усиление`,resolution:Kn,summaryRu:`Удваивает Скорость согласной цели, даёт +2 КД, преимущество на спасброски Ловкости и дополнительное ограниченное действие. После окончания цель до конца следующего хода не действует и не перемещается.`,usageRu:`Бросок не нужен; отслеживайте концентрацию, дополнительное действие и штраф после окончания.`},{id:`hypnotic-pattern`,nameRu:`Гипнотический узор`,nameEn:`Hypnotic Pattern`,level:3,school:`illusion`,castingTime:`Действие`,range:`120 футов`,components:`S, M: щепотка конфетти`,duration:`Концентрация, до 1 минуты`,tacticalRole:`Групповой контроль`,resolution:L(`wis`),summaryRu:`Узор в кубе 30 футов Очаровывает и делает Недееспособными провалившие спасбросок Мудрости цели, обнуляя их Скорость. Урон или действие союзника пробуждает цель.`,usageRu:`Каждая цель делает спасбросок Мудрости; проваливших отмечайте до урона, помощи или конца концентрации.`},{id:`lightning-bolt`,nameRu:`Молния`,nameEn:`Lightning Bolt`,level:3,school:`evocation`,castingTime:`Действие`,range:`На себя, линия 100 футов`,components:`V, S, M: мех и кристаллический стержень`,duration:`Мгновенно`,tacticalRole:`Линейный урон`,resolution:L(`dex`,`half`),dice:Yn(8,6),scaling:Xn(1),damageType:`lightning`,summaryRu:`Молния в линии длиной 100 и шириной 5 футов наносит 8к6 электричеством; спасбросок Ловкости уменьшает урон вдвое. Горючие свободные предметы загораются. Выше: +1к6.`,usageRu:`Все цели в линии делают спасбросок Ловкости; при успехе получают половину урона.`},{id:`magic-circle`,nameRu:`Магический круг`,nameEn:`Magic Circle`,level:3,school:`abjuration`,castingTime:`1 минута`,range:`10 футов`,components:`V, S, M: соль и серебряный порошок стоимостью от 100 зм, расходуются`,duration:`1 час`,tacticalRole:`Защитная зона`,resolution:Kn,summaryRu:`Создаёт цилиндр, защищающий от выбранного типа сверхъестественных существ или удерживающий их внутри: мешает входу, атакам, Очарованию, Испугу и одержимости. Выше: +1 час.`,usageRu:`Бросок при сотворении не нужен; выберите тип существ и направление защиты круга.`},{id:`major-image`,nameRu:`Большой образ`,nameEn:`Major Image`,level:3,school:`illusion`,castingTime:`Действие`,range:`120 футов`,components:`V, S, M: кусочек шерсти`,duration:`Концентрация, до 10 минут`,tacticalRole:`Многочувственная иллюзия`,resolution:qn,summaryRu:`Создаёт в кубе 20 футов образ со звуком, запахом и температурой, но без урона. Действием образ можно перемещать; изучение раскрывает иллюзию. Ячейка 4+ делает образ постоянным без концентрации.`,usageRu:`Наблюдатель действием делает проверку Интеллекта (Расследование) против вашей Сл заклинаний.`},{id:`nondetection`,nameRu:`Необнаружимость`,nameEn:`Nondetection`,level:3,school:`abjuration`,castingTime:`Действие`,range:`Касание`,components:`V, S, M: алмазная пыль стоимостью от 25 зм, расходуется`,duration:`8 часов`,tacticalRole:`Защита от прорицания`,resolution:Kn,summaryRu:`На 8 часов скрывает согласную цель от магии школы Прорицания и не позволяет воспринимать её магическими наблюдающими сенсорами.`,usageRu:`Бросок не нужен; отметьте расход алмазной пыли и окончание восьмичасовой защиты.`},{id:`phantom-steed`,nameRu:`Призрачный скакун`,nameEn:`Phantom Steed`,level:3,school:`illusion`,castingTime:`1 минута или ритуал`,range:`30 футов`,components:`V, S`,duration:`1 час`,tacticalRole:`Дальнее перемещение`,resolution:qn,summaryRu:`Создаёт ездового призрачного коня с высокой Скоростью для согласного всадника. Если скакун получает урон, он постепенно исчезает, давая минуту на спешивание.`,usageRu:`Бросок не нужен; используйте характеристики скакуна и отслеживайте час действия или минуту после урона.`},{id:`protection-from-energy`,nameRu:`Защита от энергии`,nameEn:`Protection from Energy`,level:3,school:`abjuration`,castingTime:`Действие`,range:`Касание`,components:`V, S`,duration:`Концентрация, до 1 часа`,tacticalRole:`Стихийная защита`,resolution:Kn,summaryRu:`Даёт согласной цели сопротивление одному выбранному типу урона: кислота, холод, огонь, электричество или гром.`,usageRu:`Бросок не нужен; выберите тип урона при сотворении и отслеживайте концентрацию.`},{id:`remove-curse`,nameRu:`Снятие проклятия`,nameEn:`Remove Curse`,level:3,school:`abjuration`,castingTime:`Действие`,range:`Касание`,components:`V, S`,duration:`Мгновенно`,tacticalRole:`Снятие состояния`,resolution:Kn,summaryRu:`Завершает все проклятия на существе. С проклятого предмета не снимает проклятие, но разрывает настройку владельца на этот предмет.`,usageRu:`Бросок не нужен; определите цель и завершите применимые проклятия или настройку.`},{id:`sending`,nameRu:`Послание`,nameEn:`Sending`,level:3,school:`divination`,castingTime:`Действие`,range:`Неограниченная`,components:`V, S, M: медная проволока`,duration:`Мгновенно`,tacticalRole:`Дальняя связь`,resolution:qn,summaryRu:`Передаёт знакомому существу сообщение до 25 слов на любом расстоянии и позволяет сразу ответить. Межплановая связь имеет шанс не дойти.`,usageRu:`Бросок обычно не нужен; для другой плоскости ведущий проверяет шанс доставки сообщения.`},{id:`sleet-storm`,nameRu:`Ледяной дождь`,nameEn:`Sleet Storm`,level:3,school:`conjuration`,castingTime:`Действие`,range:`150 футов`,components:`V, S, M: миниатюрный зонтик`,duration
